<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MeSO×nBOM 초진 문진표</title>
<link rel="icon" href="../logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--ink:#2C3A42;--muted:#66747A;--btn:#3E4C53;--green:#2E5E55;--deep:#1F4A42;--mint:#CFE7E1;--mint2:#D6EEE8;--mintb:#8CC9BC;--tint:#DDEFEA;--tintb:#B9DDD4;--line:#E2EBE9;--div:#E1ECE9;--err:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF;color:var(--ink)}
body{font-family:'Noto Sans KR','Noto Sans SC','Noto Sans TC',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body.zhs{font-family:'Noto Sans SC','Noto Sans KR',system-ui,sans-serif}
body.zht{font-family:'Noto Sans TC','Noto Sans KR',system-ui,sans-serif}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.welcome{flex:1;display:flex;flex-direction:column;gap:22px;padding:20px 20px 28px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--mint);border-radius:28px;padding:34px 20px 28px}
.hero img{display:block;width:240px;max-width:80%;height:auto}
.hero .ko{font-size:22px;letter-spacing:6px;color:var(--deep);font-weight:600;margin-top:4px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px;text-align:center}
h2{margin:0;font-size:22px;font-weight:700}
.small{font-size:13px;color:var(--muted);font-weight:500}
.langbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:#FFF;color:var(--ink);text-align:left;box-shadow:0 4px 14px rgba(46,94,85,.06)}
.langbtn.on{border-color:var(--mintb);background:var(--mint2)}
.langbtn b{font-size:17px}
.langbtn span{font-size:12px;letter-spacing:1px;color:var(--muted)}
.anylang{background:var(--tint);border:1px solid var(--tintb);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;color:var(--deep);font-size:12.5px;line-height:1.5}
.anylang b{font-size:13.5px;margin-bottom:2px}
.primary{min-height:56px;border:0;border-radius:16px;background:var(--green);color:#FFF;font-size:17px;font-weight:600}
.primary[disabled]{opacity:.6}
header.top{position:sticky;top:0;z-index:5;padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px;background:var(--mint);border-radius:0 0 28px 28px}
.toprow{display:flex;align-items:center;justify-content:space-between}
.toprow img{display:block;height:30px;width:auto}
.pill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#FFF;color:var(--btn);font-size:13px;font-weight:500}
.steprow{display:flex;align-items:baseline;justify-content:space-between}
.track{height:6px;background:#FFF;border-radius:3px;overflow:hidden}
.bar{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
main{flex:1;padding:20px 20px 28px;display:flex;flex-direction:column;gap:20px}
.f{display:flex;flex-direction:column;gap:8px;scroll-margin-top:170px}
.lab{font-size:14px;font-weight:600}
.req{color:var(--green)}
.in{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#FFF;font-size:16px;color:var(--ink)}
textarea.in{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.in::placeholder{color:#8A969B}
.miss .in,.miss .chips,.miss .segs,.miss.card,.miss .sigbox{outline:2px solid var(--err);outline-offset:3px;border-radius:12px}
.segs{display:flex;gap:8px}
.seg{flex:1;min-height:48px;border-radius:12px;font-size:15px;font-weight:500;padding:0 12px;border:1.5px solid var(--line);background:#FFF;color:var(--btn)}
.seg.on,.chip.on{border-color:var(--mintb);background:var(--mint2);color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;border:1.5px solid var(--line);background:#FFF;color:var(--btn)}
.card{background:#FFF;border:1px solid var(--div);border-radius:20px;box-shadow:0 6px 18px rgba(46,94,85,.07);padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:170px}
.tintbox{background:var(--tint);border:1.5px solid var(--tintb);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--deep)}
.note{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;background:var(--tint);border:1px solid var(--tintb);color:var(--deep);font-size:13px;font-weight:600;line-height:1.5;margin-top:-4px}
.warn{margin:0;font-size:13px;font-weight:600;color:var(--err)}
.qhead{display:flex;align-items:flex-start;gap:10px}
.badge{flex-shrink:0;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--green);color:#FFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qtitle{font-size:15px;font-weight:600;line-height:1.4}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;padding:0;border:0;background:none;text-align:left;font-size:14px;line-height:1.35;color:var(--ink)}
.box{flex-shrink:0;width:20px;height:20px;border:1.5px solid #A8B7B3;border-radius:5px;background:#FFF;display:flex;align-items:center;justify-content:center}
.chk.on .box{background:var(--green);border-color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.consent{display:flex;flex-direction:column;padding:6px 16px}
.crow{display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid #EEF3F2}
.crow:last-child{border-bottom:0}
.crow .chk{padding:10px 0;align-items:flex-start}
.crow .box{margin-top:1px}
.view{flex-shrink:0;margin-top:10px;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:#FFF;color:var(--muted);font-size:12px}
.full{margin:0 0 10px;padding:12px;background:#F6FAF9;border-radius:10px;font-size:12.5px;line-height:1.6;color:var(--btn);white-space:pre-wrap}
.allbox{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--tint);border:1.5px solid var(--tintb);width:100%;text-align:left;color:var(--deep);font-size:16px;font-weight:700}
.allbox .box{width:22px;height:22px}
.allbox.on .box{background:var(--green);border-color:var(--green)}
.sigbox{position:relative;height:160px;border:1.5px dashed #A9CFC6;border-radius:16px;background:#FFF;touch-action:none}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px}
.sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
.sigtools{display:flex;justify-content:flex-end}
footer.bot{position:sticky;bottom:0;padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--div);background:#FFF}
.navrow{display:flex;gap:10px}
.ghost{min-height:52px;padding:0 22px;border:1.5px solid var(--line);border-radius:14px;background:#FFF;color:var(--btn);font-size:16px;font-weight:500}
.next{flex:1;min-height:52px;border:0;border-radius:14px;font-size:16px;font-weight:600;background:var(--green);color:#FFF}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 28px;text-align:center}
.check{width:84px;height:84px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center}
.sum{width:100%;background:#FFF;border:1px solid var(--div);border-radius:20px;box-shadow:0 6px 18px rgba(46,94,85,.07);padding:6px 18px}
.sum div{display:flex;justify-content:space-between;padding:12px 0;font-size:14px}
.sum div+div{border-top:1px solid #E8F1EE}
</style>
</head>

    segs(seg(t.female, S.gender === 'f', 'gender:f'), seg(t.male, S.gender === 'm', 'gender:m')) + '</div>';
  if (!I) {
    h += '<div class="f" data-f="phone"><span class="lab">' + esc(t.phone) + req() + '</span>' + input('phone', '010-0000-0000', 'tel', ' autocomplete="tel" inputmode="tel"') + '</div>';
  } else {
    h += '<div class="f" data-f="sns"><span class="lab">' + esc(t.snsQ) + req() + '</span><span class="small" style="margin-top:-4px">' + esc(t.snsHint) + '</span>' +
      chips('sns', t.snsApps, false) +
      input('snsId', (S.sns != null ? t.snsApps[S.sns] + ' · ' : '') + t.snsPh, 'text', ' autocapitalize="none" autocomplete="off"') + '</div>';
  }
  h += '<div class="f"><span class="lab">' + esc(t.referral) + '</span><span class="small" style="margin-top:-4px">' + esc(t.multi) + '</span>' + chips('refs', t.refs, true) +
    (t.refFriend != null && S.refs[t.refFriend] ? input('friend', t.friendPh) : '') +
    (!I && S.refs[naverIdx(t)] ? subChips(t.naverQ, 'refNaver', t.naverSub) : '') +
    (S.refs[aiIdx(t)] ? subChips(t.aiQ, 'refAi', t.aiSub) : '') + '</div>';
  return h;
}

function naverIdx(t) { for (var i = 0; i < t.refs.length; i++) if (/naver|네이버/i.test(t.refs[i])) return i; return -1; }
function aiIdx(t) { return t.refs.indexOf('AI'); }
function subChips(q, key, labels) {
  return '<div class="tintbox" style="padding:12px 14px;gap:8px;border-radius:12px"><span style="font-size:13px;font-weight:600">' + esc(q) + '</span>' + chips(key, labels, true) + '</div>';
}

function vSkin() {
  var t = T(), h = '';
  h += '<div class="f"><span class="lab" style="font-size:17px">' + esc(t.skinQ) + '</span><span class="small" style="margin-top:-4px">' + esc(t.multi) + '</span>' + chips('concerns', t.concerns, true) + '</div>';
  h += '<div class="f"><span class="lab">' + esc(t.prev) + '</span><textarea class="in" rows="4" data-k="prev" placeholder="' + esc(t.prevPh) + '">' + esc(S.prev) + '</textarea></div>';
  h += '<div class="card"><div style="display:flex;flex-direction:column;gap:4px"><span class="qtitle">' + esc(t.surgQ) + '</span><span class="small">' + esc(t.surgHint) + '</span></div>' +
    checks('surg', t.surgs, 'grid2') +
    (S.surg[t.surgs.length - 1] ? input('surgOther', t.surgOtherPh) : '') + '</div>';
  h += '<div class="tintbox f" data-f="implant"><span style="display:flex;align-items:flex-start;gap:8px;font-size:15px;font-weight:700;line-height:1.4">' + ICON_ALERT +
    '<span>' + esc(t.implant) + req() + '</span></span><span style="font-size:13px;line-height:1.5">' + esc(t.implantNote) + '</span>' +
    '<textarea class="in" rows="2" data-k="implant" placeholder="' + esc(t.implantPh) + '" style="min-height:84px;border-color:var(--tintb)">' + esc(S.implant) + '</textarea></div>';
  return h;
}

function qCard(k, num, label, ph, extra) {
  var t = T(), v = S.ans[k];
  return '<div class="card" data-f="ans.' + k + '"><div class="qhead"><span class="badge">' + num + '</span><span class="qtitle">' + esc(label) + req() + '</span></div>' +
    segs(seg(t.no, v === 'n', 'ans:' + k + ':n'), seg(t.yes, v === 'y', 'ans:' + k + ':y')) +
    (ph && v === 'y' ? input('ansDetail.' + k, ph) : '') + (extra || '') + '</div>';
}
function vHealth() {
  var t = T(), h = '';
  var condOn = Object.keys(S.conds).some(function (k) { return S.conds[k] && +k !== t.conds.length - 1; });
  h += '<div class="card" data-f="conds"><div class="qhead"><span class="badge">1</span><div style="display:flex;flex-direction:column;gap:4px"><span class="qtitle">' + esc(t.condQ) + req() + '</span><span class="small">' + esc(t.multi) + '</span></div></div>' +
    chips('conds', t.conds, true) + (condOn ? input('condDetail', t.condPh) : '') + '</div>';
  h += qCard('surgery', '1-1', t.qSurg, t.surgPh);
  var hormone = '<div class="tintbox" style="padding:14px;gap:6px;border-radius:12px"><span style="font-size:14px;font-weight:700;line-height:1.4">' + esc(t.hormoneQ) + '</span>' +
    '<span style="font-size:12px;line-height:1.5">' + esc(t.hormoneNote) + '</span>' + checks('hormones', t.hormones, '') + '</div>';
  h += qCard('meds', '2', t.qMeds, t.medsPh, hormone);
  h += qCard('allergy', '3', t.qAllergy, t.allergyPh);
  if (S.gender !== 'm') h += qCard('preg', '4', t.qPreg, null);
  return h;
}

function vConsent() {
  var t = T(), keys = ['c1', 'c2', 'c3', 'c4'];
  var all = keys.every(function (k) { return S.consent[k]; });
  var h = '<button type="button" class="allbox' + (all ? ' on' : '') + '" data-act="all" aria-pressed="' + all + '"><span class="box">' + (all ? TICK : '') + '</span>' + esc(t.agreeAll) + '</button>';
  h += '<div class="card consent" data-f="consent">' + keys.map(function (k) {
    var on = !!S.consent[k];
    return '<div><div class="crow"><button type="button" class="chk' + (on ? ' on' : '') + '" data-act="consent:' + k + '" aria-pressed="' + on + '"><span class="box">' + (on ? TICK : '') + '</span><span>' + esc(t[k]) + '</span></button>' +
      '</div></div>';
  }).join('') + '</div>';
  h += '<div class="f" data-f="sign"><span class="lab">' + esc(t.sign) + req() + '</span>' +
    '<div class="sigbox"><canvas id="sig" aria-label="' + esc(t.sign) + '"></canvas>' + (S.sign ? '' : '<div class="sighint" id="sighint">' + esc(t.signHint) + '</div>') + '</div>' +
    '<div class="sigtools"><button type="button" class="view" style="margin-top:0" data-act="clearSign">' + esc(t.clearSign) + '</button></div></div>';
  return h;
}

function vDone() {
  var t = T();
  return '<div class="done"><div class="check"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2E5E55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"/></svg></div>' +
    '<div style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:26px">' + esc(t.doneTitle) + '</h2><p style="margin:0;font-size:15px;line-height:1.6;color:var(--muted)">' + esc(t.doneSub) + '</p></div>' +
    '<div class="sum"><div><span style="color:var(--muted)">' + esc(t.langLabel) + '</span><b>' + cur().native + '</b></div><div><span style="color:var(--muted)">' + esc(t.ptype) + '</span><b>' + esc(intl() ? t.intl : t.dom) + '</b></div></div>' +
    '<button type="button" class="ghost" data-act="restart">' + esc(t.restart) + '</button></div>';
}

function render() {
  var t = T();
  document.documentElement.lang = cur().html;
  document.body.className = S.lang === 'zhs' ? 'zhs' : S.lang === 'zht' ? 'zht' : '';
  if (S.step === 0) { app.innerHTML = vWelcome(); return; }
  if (S.step === 5) { app.innerHTML = vDone(); return; }
  var body = S.step === 1 ? vInfo() : S.step === 2 ? vSkin() : S.step === 3 ? vHealth() : vConsent();
  app.innerHTML =
    '<header class="top"><div class="toprow"><img src="' + LOGO + '" alt="MeSO×nBOM"><button type="button" class="pill" data-act="toLang" aria-label="Change language">' + ICON_GLOBE + cur().native + '</button></div>' +
    '<div class="steprow"><h2>' + esc(t.steps[S.step - 1]) + '</h2><span class="small">' + S.step + ' / 4</span></div>' +
    '<div class="track"><div class="bar" style="width:' + (S.step * 25) + '%"></div></div></header>' +
    '<main>' + body + '</main>' +
    '<footer class="bot">' + (S.err ? '<p class="warn" role="alert" style="text-align:center">' + esc(S.err) + '</p>' : '') +
    '<div class="navrow"><button type="button" class="ghost" data-act="back">' + esc(t.back) + '</button>' +
    '<button type="button" class="next" data-act="next"' + (S.sending ? ' disabled' : '') + '>' + esc(S.sending ? t.sending : (S.step === 4 ? t.submit : t.next)) + '</button></div></footer>';
  S.miss.forEach(function (f) { var el = app.querySelector('[data-f="' + f + '"]'); if (el) el.classList.add('miss'); });
  if (S.step === 4) initSig();
  if (S.step === 1) checkName();
}

/* ---------- 서명판 ---------- */
function initSig() {
  var c = document.getElementById('sig'); if (!c) return;
  var r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  var x = c.getContext('2d'); x.scale(dpr, dpr);
  x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#2C3A42';
  if (S.sign) { var im = new Image(); im.onload = function () { x.drawImage(im, 0, 0, r.width, r.height); }; im.src = S.sign; }
  var down = false, last = null, drew = false;
  function pt(e) { var b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  c.addEventListener('pointerdown', function (e) { down = true; last = pt(e); c.setPointerCapture(e.pointerId); var hnt = document.getElementById('sighint'); if (hnt) hnt.remove(); e.preventDefault(); });
  c.addEventListener('pointermove', function (e) { if (!down) return; var p = pt(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p; drew = true; e.preventDefault(); });
  function up() { if (!down) return; down = false; if (drew) S.sign = exportSig(c); }
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up); c.addEventListener('pointerleave', up);
}
function exportSig(c) {
  var o = document.createElement('canvas'); o.width = 400; o.height = Math.round(400 * c.height / c.width);
  var ox = o.getContext('2d'); ox.fillStyle = '#FFF'; ox.fillRect(0, 0, o.width, o.height); ox.drawImage(c, 0, 0, o.width, o.height);
  return o.toDataURL('image/jpeg', 0.6);
}

/* ---------- 확인 ---------- */
function missing() {
  var t = T(), m = [], I = intl();
  if (S.step === 1) {
    if (!S.name.trim() || (I && /[^\x00-\x7F]/.test(S.name))) m.push('name');
    if (I && (S.country == null || (S.country === t.countries.length - 1 && !S.countryOther.trim()))) m.push('country');
    if (!S.gender) m.push('gender');
    if (!I && !S.phone.trim()) m.push('phone');
    if (I && (S.sns == null || !S.snsId.trim())) m.push('sns');
  } else if (S.step === 2) {
    if (!S.implant.trim()) m.push('implant');
  } else if (S.step === 3) {
    if (!anyOn(S.conds)) m.push('conds');
    ['surgery', 'meds', 'allergy'].forEach(function (k) { if (!S.ans[k]) m.push('ans.' + k); });
    if (S.gender !== 'm' && !S.ans.preg) m.push('ans.preg');
  } else if (S.step === 4) {
    if (!(S.consent.c1 && S.consent.c2 && S.consent.c3)) m.push('consent');
    if (!S.sign) m.push('sign');
  }
  return m;
}
function checkName() {
  var w = document.getElementById('nameWarn'); if (!w) return;
  w.style.display = intl() && /[^\x00-\x7F]/.test(S.name) ? 'block' : 'none';
}

/* ---------- 제출 ---------- */
function payload() {
  var t = T(), K = D.ko, I = intl(), a = {}, d = {};
  ['surgery', 'meds', 'allergy', 'preg'].forEach(function (k) { if (S.ans[k]) a[k] = S.ans[k]; if (S.ans[k] === 'y' && S.ansDetail[k]) d[k] = S.ansDetail[k].trim(); });
  return {
    lang: S.lang, langLabel: cur().native, ptype: I ? '외국인' : '내국인',
    name: S.name.trim(), gender: S.gender === 'm' ? '남' : '여',
    phone: I ? '' : S.phone.trim(),
    country: I ? (S.country === K.countries.length - 1 ? S.countryOther.trim() : K.countries[S.country]) : '',
    sns: I ? K.snsApps[S.sns] : '', snsId: I ? S.snsId.trim() : '',
    refs: picked(S.refs, t.refs), friend: (t.refFriend != null && S.refs[t.refFriend]) ? S.friend.trim() : '',
    refNaver: (!I && S.refs[naverIdx(t)]) ? picked(S.refNaver, K.naverSub) : [],
    refAi: S.refs[aiIdx(t)] ? picked(S.refAi, K.aiSub) : [],
    concerns: picked(S.concerns, K.concerns), prev: S.prev.trim(),
    surg: picked(S.surg, K.surgs), surgOther: S.surg[K.surgs.length - 1] ? S.surgOther.trim() : '',
    implant: S.implant.trim(),
    conds: picked(S.conds, K.conds), condDetail: S.condDetail.trim(),
    ans: a, ansDetail: d, hormones: picked(S.hormones, K.hormones),
    consent: { c1: !!S.consent.c1, c2: !!S.consent.c2, c3: !!S.consent.c3, c4: !!S.consent.c4 },
    sign: S.sign
  };
}
function submit() {
  if (PREVIEW) { S.step = 5; render(); window.scrollTo(0, 0); return; }
  S.sending = true; S.err = ''; render();
  function fail() { S.sending = false; S.err = T().sendErr; render(); }
  // text/plain 으로 보내야 브라우저 사전 확인(CORS preflight) 없이 Apps Script로 바로 간다
  fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload()) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok) return fail();
      S.sending = false; S.step = 5; render(); window.scrollTo(0, 0);
    })
    .catch(fail);
}

/* ---------- 이벤트 ---------- */
function exclusive(key, i, len) {
  var o = Object.assign({}, S[key]), none = len - 1;
  if (i === none) { S[key] = o[none] ? {} : {}; if (!o[none]) S[key][none] = true; return; }
  o[i] = !o[i]; delete o[none]; S[key] = o;
}
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var p = b.getAttribute('data-act').split(':'), act = p[0], t = T();
  if (act === 'lang') { S.lang = p[1]; S.ptype = null; S.country = null; S.sns = null; S.refs = {}; S.refNaver = {}; S.refAi = {}; }
  else if (act === 'start') { S.step = 1; window.scrollTo(0, 0); }
  else if (act === 'toLang') { S.step = 0; S.err = ''; S.miss = []; }
  else if (act === 'ptype') { S.ptype = p[1]; }
  else if (act === 'gender') { S.gender = p[1]; if (p[1] === 'm') delete S.ans.preg; }
  else if (act === 'pick') { S[p[1]] = +p[2]; }
  else if (act === 'tog') {
    var key = p[1], i = +p[2];
    if (key === 'conds') exclusive('conds', i, t.conds.length);
    else if (key === 'hormones') exclusive('hormones', i, t.hormones.length);
    else { S[key] = Object.assign({}, S[key]); S[key][i] = !S[key][i]; }
  }
  else if (act === 'ans') { S.ans[p[1]] = p[2]; }
  else if (act === 'consent') { S.consent[p[1]] = !S.consent[p[1]]; }
  else if (act === 'all') { var on = !['c1', 'c2', 'c3', 'c4'].every(function (k) { return S.consent[k]; }); ['c1', 'c2', 'c3', 'c4'].forEach(function (k) { S.consent[k] = on; }); }
  else if (act === 'view') { S.open[p[1]] = !S.open[p[1]]; }
  else if (act === 'clearSign') { S.sign = null; }
  else if (act === 'restart') { reset(); }
  else if (act === 'back') { S.err = ''; S.miss = []; S.step = Math.max(0, S.step - 1); window.scrollTo(0, 0); }
  else if (act === 'next') {
    if (S.sending) return;
    var m = missing();
    if (m.length) {
      S.miss = m; S.err = t.need; render();
      var el = app.querySelector('.miss'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    S.miss = []; S.err = '';
    if (S.step === 4) { submit(); return; }
    S.step++; window.scrollTo(0, 0);
  }
  if (S.miss.length) S.miss = missing();
  if (!S.miss.length) S.err = '';
  render();
});
app.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-k'); if (!k) return;
  setK(k, e.target.value);
  if (k === 'name') checkName();
});

render();
</script>
</body>
</html>
